[project]
name = "seatify-ai-api"
version = "0.1.0"
description = "AI API for Seatify"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "langchain-openai",
    "langchain-ollama",
    "langgraph>=1.2.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]